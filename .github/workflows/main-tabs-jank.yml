name: Main tabs jank A-B

on:
  push:
    branches: [perf/main-tabs-jank]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-tabs-jank-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NATIVE_TARGET: arm64-v8a
      CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
      CCACHE_HARDLINK: 'true'
      CCACHE_NOHASHDIR: 'true'
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure Python
        run: echo "CHAQUOPY_BUILD_PYTHON=$(which python)" >> "$GITHUB_ENV"
      - uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: main-tabs-jank-arm64
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0'
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure isolated test installation
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          python - <<'PY'
          import json
          from pathlib import Path
          package = 'com.exteraless.janktest'
          p = Path('TMessagesProj/google-services.json')
          data = json.loads(p.read_text())
          # Match the local test package for resource generation only.
          # This does not register it with Firebase: push delivery is not a test target.
          for client in data['client']:
              client['client_info']['android_client_info']['package_name'] = package
          p.write_text(json.dumps(data))
          p = Path('TMessagesProj/src/main/AndroidManifest.xml')
          text = p.read_text()
          begin = text.index('<application')
          end = text.index('>', begin) + 1
          text = text[:end] + '\n        <profileable android:shell="true" />' + text[end:]
          p.write_text(text)
          text = text.replace('android:label="@string/NagramX"',
                              'android:label="exteraless Jank Test"', 1)
          p.write_text(text)
      - name: Build both variants with the same signing key
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          COMMIT_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p jank-apks
          export BUILD_TIMESTAMP=$(date +%s)
          for variant in A-baseline B-experiment; do
            skip=false
            if [ "$variant" = B-experiment ]; then skip=true; fi
            ./gradlew :TMessagesProj:assembleStaging \
              -PAPP_PACKAGE=com.exteraless.janktest \
              -PmainTabsJankTrace=true \
              -PmainTabsSkipItemAnimationCleanup="$skip"
            mapfile -t apks < <(find TMessagesProj/build/outputs/apk/staging -maxdepth 1 -name '*.apk')
            if [ "${#apks[@]}" -ne 1 ]; then
              printf 'Expected one arm64 APK, found %s\n' "${#apks[@]}"
              exit 1
            fi
            cp "${apks[0]}" "jank-apks/$variant.apk"
          done
          printf 'package=com.exteraless.janktest\ncommit=%s\nA: cleanup enabled\nB: cleanup disabled for main tabs\n' "$COMMIT_ID" > jank-apks/README.txt
      - uses: actions/upload-artifact@v7
        with:
          name: main-tabs-jank-A-B-arm64
          path: jank-apks/
          if-no-files-found: error
